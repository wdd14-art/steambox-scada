<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT. SIAP - Monitoring & Kontrol Steambox 1-30 (Haiwell Cloud SCADA)</title>
    
    <!-- HAIWELL SCADA ISWRITE PERMISSION & SESSION DECLARATION -->
    <script>var isWrite = true; var indexlocal = false; var connId = 'myLocalId';</script>

    <!-- DEDICATED MODULAR STYLESHEET -->
    <link rel="stylesheet" href="steambox.css?v=38">

    <!-- HAIWELL SCADA OFFICIAL WEBSERVER CORE ENGINE LIBRARIES -->
    <script src="libs/variable.js?v=38"></script>
    <script src="../javascripts/lib/socket.io.js"></script>
    <script src="../javascripts/lib/jquery.min.js"></script>
    <script src="../javascripts/lib/lib.js"></script>

    <!-- DEDICATED MODULAR JAVASCRIPT LOGIC (MATCHING MASTER DASHBOARD.JS & MASTER_FINAL.TXT) -->
    <script src="steambox.js?v=38"></script>
</head>
<body>

    <!-- HEADER BAR -->
    <header class="header-bar">
        <div class="logo-area">
            <div>
                <div class="company-logo">PT. SIAP</div>
                <div class="company-sub">System Control & Monitoring Outdoor</div>
            </div>
        </div>

        <div class="header-center">
            <span>STEAMBOX DASHBOARD</span>
            <div class="clock-display" id="clockDisplay">2026/07/27 SENIN 00:00:00</div>
        </div>

        <div class="header-right">
            <div class="user-badge">
                <div class="user-icon">A</div>
                <span id="currentUser">Connecting...</span>
            </div>
        </div>
    </header>

    <!-- TOP MENU BAR -->
    <nav class="top-menu-bar">
        <div class="menu-left">
            <label for="groupSelect" class="menu-label">Pilih Steambox:</label>
            <select id="groupSelect" class="styled-select">
                <option value="1">Steambox 1-5</option>
                <option value="2">Steambox 6-10</option>
                <option value="3">Steambox 11-15</option>
                <option value="4">Steambox 16-20</option>
                <option value="5">Steambox 21-25</option>
                <option value="6">Steambox 26-30</option>
                <option value="0">Semua (1-30)</option>
            </select>
        </div>

        <div class="menu-center">
            <div class="auto-rotate-container">
                <input type="checkbox" id="autoRotateCheck">
                <label for="autoRotateCheck">Auto Slide</label>
            </div>
        </div>

        <div class="menu-right">
            <button class="btn-switch-view active" id="btnViewDetail" onclick="switchViewMode('detail')">Grid Lengkap</button>
            <button class="btn-switch-view" id="btnViewMonitor" onclick="switchViewMode('monitor')">Monitor Ruang</button>
        </div>
    </nav>

    <!-- MAIN UNITS CONTAINER (GRID LENGKAP) -->
    <main class="units-container" id="unitsContainer">
        <!-- Generated Dynamically by steambox.js -->
    </main>

    <!-- MONITOR RUANG CONTAINER (RINGKAS) -->
    <main class="monitor-ruang-container" id="monitorRuangContainer" style="display: none;">
        <table class="monitor-table">
            <thead>
                <tr>
                    <th style="width: 20%;">No. SB</th>
                    <th style="width: 40%;">Jam Selesai</th>
                    <th style="width: 40%;">Sisa Waktu</th>
                </tr>
            </thead>
            <tbody id="monitorRuangTbody">
                <!-- Generated Dynamically by steambox.js -->
            </tbody>
        </table>
    </main>

    <!-- RECIPE SELECTOR & INPUT DIALOG POPUP MODAL -->
    <div class="modal-backdrop" id="recipeModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Resep Browser & Input Tugas Baru - Steambox Unit <span id="modalUnitId">01</span></h3>
                <button class="modal-close-btn" onclick="closeRecipeModal()">&times;</button>
            </div>
            
            <div class="modal-tabs">
                <button class="tab-btn active" id="tabMasterBtn" onclick="switchRecipeTab('master')">Master Database Resep SCADA</button>
                <button class="tab-btn" id="tabCustomBtn" onclick="switchRecipeTab('custom')">+ Tambah Resep Baru ke Unit <span class="unit-id-highlight">01</span></button>
            </div>

            <div class="modal-body">
                <!-- TAB 1: MASTER RECIPE LIST -->
                <div class="recipe-tab-content" id="recipeTabMaster">
                    <p style="margin: 0 0 10px 0; font-weight: bold; color: #4b5563; font-size: 13px;">Pilih salah satu resep master di bawah untuk diterapkan ke Unit <span class="unit-id-highlight">01</span>:</p>
                    <div class="recipe-grid-options" id="recipeGridOptions">
                        <!-- Populated by steambox.js -->
                    </div>
                </div>

                <!-- TAB 2: ADD CUSTOM RECIPE FORM -->
                <div class="recipe-tab-content" id="recipeTabCustom" style="display: none;">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label">Kode Produk</label>
                            <input type="text" class="form-input" id="inp_kode" placeholder="sbmk" value="sbmk">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nama Produk</label>
                            <input type="text" class="form-input" id="inp_nama" placeholder="mentor" value="mentor">
                        </div>
                    </div>

                    <div class="form-row-3">
                        <div class="form-group">
                            <label class="form-label">Versi Resep</label>
                            <input type="text" class="form-input" id="inp_versi" placeholder="1" value="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Warna Produk</label>
                            <input type="text" class="form-input" id="inp_warna" placeholder="kuning" value="kuning">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Qty (Kg)</label>
                            <input type="number" class="form-input" id="inp_qty" placeholder="125" value="125">
                        </div>
                    </div>

                    <div class="form-row-3">
                        <div class="form-group">
                            <label class="form-label">Tipe Trolly (Teks)</label>
                            <input type="text" class="form-input" id="inp_trolly" placeholder="rapat / longgar" value="rapat">
                        </div>
                        <div class="form-group">
                            <label class="form-label">No. Batch</label>
                            <input type="number" class="form-input" id="inp_batch" placeholder="1" value="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Target Masak (Menit)</label>
                            <input type="number" class="form-input" id="inp_durasi" placeholder="1" value="1">
                        </div>
                    </div>

                    <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="chk_save_master" checked>
                        <label for="chk_save_master" style="font-size: 12px; font-weight: 700; color: #334155;">Simpan juga ke Master Database Browser</label>
                    </div>

                    <button class="btn-cmd btn-tugas" style="margin-top: 14px; padding: 10px; font-size: 14px;" onclick="submitCustomRecipe()">🚀 TRANSFER RESEP BARU KE STEAMBOX</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
